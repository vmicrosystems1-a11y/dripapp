
name: Build Drip Irrigation APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android project
        shell: bash
        run: |
          mkdir -p /tmp/drip_sources
          cp -R lib pubspec.yaml /tmp/drip_sources/
          cp android/app/google-services.json /tmp/drip_sources/google-services.json
          flutter create --platforms=android --org com.example --project-name drip_irrigation_app /tmp/drip_build
          cp /tmp/drip_sources/lib/*.dart /tmp/drip_build/lib/
          rm -rf /tmp/drip_build/test
          printf "analyzer:\n  errors:\n    invalid_annotation_target: ignore\n" > /tmp/drip_build/analysis_options.yaml
          cp /tmp/drip_sources/pubspec.yaml /tmp/drip_build/pubspec.yaml
          cp /tmp/drip_sources/google-services.json /tmp/drip_build/android/app/google-services.json
          python3 scripts/configure_android.py /tmp/drip_build

      - name: Install Flutter dependencies
        working-directory: /tmp/drip_build
        run: flutter pub get

      - name: Check Dart syntax and analyze
        working-directory: /tmp/drip_build
        run: |
          dart format --output=none lib
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build installable APK
        working-directory: /tmp/drip_build
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drip-irrigation-android-apk
          path: /tmp/drip_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
